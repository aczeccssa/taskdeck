name: Documentation

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.14'}
      - name: Build latest docs
        working-directory: docs-site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_TASKDECK_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          VERSION="${VITE_TASKDECK_VERSION:-$(sed -n 's/^version = \"\(.*\)\"/\1/p' ../Cargo.toml | head -1)}"
          npm install --no-package-lock
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/" VITE_TASKDECK_VERSION="$VERSION" npm run build
      - name: Assemble version index
        shell: bash
        run: |
          mkdir -p docs-site/dist/versions
          tags=$(git tag --list 'v*.*.*' --sort=-version:refname)
          current_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          current_tag="v$current_version"
          git tag --list 'v*.*.*' --sort=-version:refname | while read tag; do
            [ -z "$tag" ] && continue
            mkdir -p "docs-site/dist/versions/$tag"
            if [ "$tag" = "$current_tag" ] && git diff --quiet "$tag" HEAD -- Cargo.toml Cargo.lock build.rs src frontend Dockerfile compose.yaml compose/internal-cluster/compose.yaml taskdeck.example.yaml; then
              versioned_dist="$RUNNER_TEMP/taskdeck-current-version-docs"
              rm -rf "$versioned_dist"
              mkdir -p "$versioned_dist"
              (cd docs-site && BASE_PATH="/${GITHUB_REPOSITORY#*/}/versions/$tag/" VITE_TASKDECK_VERSION="$current_version" npm run build -- --outDir "$versioned_dist")
              cp -R "$versioned_dist/." "docs-site/dist/versions/$tag/"
            elif [ "$tag" = "${GITHUB_REF_NAME:-}" ]; then
              latest_dist="$RUNNER_TEMP/taskdeck-latest-docs"
              rm -rf "$latest_dist"
              cp -R docs-site/dist "$latest_dist"
              rm -rf docs-site/dist/versions
              mkdir -p "docs-site/dist/versions/$tag"
              cp -R "$latest_dist/." "docs-site/dist/versions/$tag/"
            else
              archive="$RUNNER_TEMP/docs-$tag"
              rm -rf "$archive"
              mkdir -p "$archive"
              git archive "$tag" docs-site | tar -x -C "$archive"
              if [ -f "$archive/docs-site/package.json" ]; then
                (cd "$archive/docs-site" && npm install --no-package-lock && BASE_PATH="/taskdeck/versions/$tag/" VITE_TASKDECK_VERSION="$(echo "$tag" | cut -c2-)" npm run build)
                cp -R "$archive/docs-site/dist/." "docs-site/dist/versions/$tag/"
              fi
            fi
          done
          python3 - "$tags" <<'PY'
          import json, subprocess, sys
          tags = [tag for tag in sys.argv[1].splitlines() if tag]
          rows = []
          for tag in tags:
              published = subprocess.check_output(["git", "log", "-1", "--format=%cI", f"{tag}^{{commit}}"], text=True).strip()
              rows.append({"tag": tag, "publishedAt": published, "path": f"/versions/{tag}/", "releaseUrl": f"https://github.com/aczeccssa/taskdeck/releases/tag/{tag}", "checksumsUrl": f"https://github.com/aczeccssa/taskdeck/releases/download/{tag}/SHA256SUMS"})
          with open("docs-site/dist/versions/index.json", "w", encoding="utf-8") as f:
              json.dump({"latest": tags[0] if tags else None, "versions": rows}, f, indent=2)
              f.write("\n")
          PY
          cp docs-site/dist/index.html docs-site/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs-site/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
