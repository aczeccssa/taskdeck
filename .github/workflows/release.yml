name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.14'}
      - name: Verify tag, frontend, docs and updater
        shell: bash
        run: |
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${GITHUB_REF_NAME#v}"
          bun install --cwd frontend --frozen-lockfile
          bun run --cwd frontend build
          npm install --prefix docs-site --no-package-lock
          BASE_PATH="/${GITHUB_REPOSITORY#*/}/" VITE_TASKDECK_VERSION="${GITHUB_REF_NAME#v}" npm run build --prefix docs-site
          cargo test --locked update::tests -- --nocapture
          cargo check --locked
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-latest, target: aarch64-unknown-linux-gnu}
          - {os: macos-14, target: x86_64-apple-darwin}
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-latest, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.14'}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross compiler
        if: startsWith(matrix.target, 'aarch64-unknown-linux')
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure ARM64 Linux linker
        if: startsWith(matrix.target, 'aarch64-unknown-linux')
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build binary
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/taskdeck" package/taskdeck
          cp LICENSE README.md taskdeck.example.yaml package/
          tar -czf "taskdeck-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C package .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item package -ItemType Directory -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/taskdeck.exe" package/taskdeck.exe
          Copy-Item LICENSE,README.md,taskdeck.example.yaml package
          Compress-Archive -Path package/* -DestinationPath "taskdeck-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: taskdeck-${{ matrix.target }}
          path: taskdeck-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          start = changelog.find(heading)
          if start < 0:
              raise SystemExit(f"missing changelog section for {tag}")
          end = changelog.find("\n## ", start + len(heading))
          notes = changelog[start:end if end >= 0 else None].rstrip()
          notes += f"\n\nVersioned documentation: https://aczeccssa.github.io/taskdeck/versions/{tag}/\n\nChecksums: SHA256SUMS\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Checksums
        working-directory: artifacts
        run: sha256sum taskdeck-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: false
