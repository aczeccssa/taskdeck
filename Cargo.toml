[package]
name = "taskdeck"
version = "0.1.0"
edition = "2024"
description = "One daemon for project tasks, with TUI, Web UI, CLI, and MCP controls"
license = "MIT"

[dependencies]
argon2 = "0.5.3"
anyhow = "1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
cron = "0.15.0"
sha2 = "0.10.9"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
command-group = "5.0.1"
crossterm = "0.29"
fs2 = "0.4"
futures-util = "0.3.33"
json5 = "0.4"
ratatui = { version = "0.26", features = ["crossterm"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.36.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
unicode-casefold = "0.2.0"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
nix = { version = "0.30", features = ["signal", "process"] }
shell-escape = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
