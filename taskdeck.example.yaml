version: 1
session: my-project

# Every task inherits these values; task-level env overrides them.
# Runtime precedence is daemon environment < workspace_env < task env.
workspace_env:
  APP_ENV: development
  DOTNET_ENVIRONMENT: Development

task_order:
  - Run Backend API
  - worker
  - cleanup

tasks:
  # Override an existing .vscode/tasks.json task by its label.
  Run Backend API:
    auto_start: true
    stop_timeout_ms: 5000
    clear_logs_on_restart: false
    env:
      ASPNETCORE_ENVIRONMENT: Development

  # Add a task that does not exist in VS Code.
  worker:
    command: cargo
    args: [run, --bin, worker]
    cwd: ./services/worker
    shell: false
    auto_start: false

  cleanup:
    command: ./scripts/cleanup.sh
    cwd: .
    shell: true
    schedule: "*/10 * * * *"   # five fields, local time; six-field forms put seconds first
